name: flutter_ai_elements
description: "Composable, themeable Flutter UI for AI chat: conversation view, message bubbles, a streaming-aware composer, and a loader, styled through a mobile-first theme extension."
version: 0.5.1
homepage: https://github.com/ananmouaz/flutter_ai
repository: https://github.com/ananmouaz/flutter_ai/tree/main/packages/flutter_ai_elements
issue_tracker: https://github.com/ananmouaz/flutter_ai/issues

topics:
  - ai
  - llm
  - chat
  - streaming
  - widgets

# Rendered on the pub.dev listing (up to 5).
screenshots:
  - description: "An agent answer with a run summary, sources, and follow-ups."
    path: screenshots/answer.png
  - description: "An interactive agent question with choices and a free-text answer."
    path: screenshots/question.png
  - description: "An approval gate that pauses the agent before it acts."
    path: screenshots/approval.png
  - description: "A source-details sheet for a grounded answer."
    path: screenshots/sources.png
  - description: "The same conversation in the dark theme."
    path: screenshots/dark.png

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

# Pure Flutter widgets (no platform channels) — supported everywhere Flutter is.
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_ai_client: ^0.3.0
  flutter_ai_core: ^0.1.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^5.0.0
